[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "callquake"
version = "0.1.0"
description = "Know the blast radius before you edit a function: AST call graph + git history = 0-100 risk score."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ox-alpha" }]
keywords = ["static-analysis", "call-graph", "risk", "blast-radius", "ast"]

[project.scripts]
callquake = "callquake.cli:main"

[tool.setuptools]
packages = ["callquake"]
